name: Post Cricket News to Instagram

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg is available (for reels)
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Generate images and reels for new stories
        run: python main.py generate

      - name: Commit and push generated images
        run: |
          git config user.name "cricket-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add generated/ data/pending.json
          git diff --staged --quiet || git commit -m "Auto: generate cricket news image [skip ci]"
          git push

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_RAW_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/generated
        run: python main.py publish

      - name: Commit posted log
        run: |
          git add data/posted_log.json data/pending.json
          git diff --staged --quiet || git commit -m "Auto: mark stories as posted [skip ci]"
          git push
